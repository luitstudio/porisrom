services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: porisrom
      POSTGRES_PASSWORD: porisrom
      POSTGRES_DB: porisrom
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - porisrom_postgres_data:/var/lib/postgresql/data

volumes:
  porisrom_postgres_data:
