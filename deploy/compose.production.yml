# Hostinger VPS production stack. Caddy remains the only public HTTPS listener.
name: porisrom-production

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Supply the private production PostgreSQL URL for the Compose postgres service}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Supply the production JWT access secret}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Supply a distinct production JWT refresh secret}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Supply the exact HTTPS marketplace and admin origins}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?Supply the HTTPS API origin}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Supply the production Cloudinary cloud name}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Supply the production Cloudinary API key}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Supply the production Cloudinary API secret}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Supply the production Google OAuth client ID}
  SOCKET_ADAPTER: ${SOCKET_ADAPTER:-postgres}
  SOCKET_CHANNEL_PREFIX: ${SOCKET_CHANNEL_PREFIX:?Supply a production-specific realtime channel prefix}
  REALTIME_EXPECTED_INSTANCES: ${REALTIME_EXPECTED_INSTANCES:-1}
  KYC_LOCAL_FALLBACK_ENABLED: "false"
  PROFILE_PHOTO_UPLOAD_DIR: /app/runtime/public
  PRIVATE_DOCUMENT_UPLOAD_DIR: /app/runtime/private

services:
  postgres:
    image: postgres:18.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Supply the production database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Supply the production database password}
      POSTGRES_DB: ${POSTGRES_DB:?Supply the production database name}
    volumes:
      - production_postgres_18:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1.0

  # Opt-in, offline configuration check. It never connects to PostgreSQL.
  production-config-check:
    profiles: [validation]
    build: { context: .., target: migrate }
    entrypoint: [node, /app/deploy/validate-production-database-url.mjs]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Supply the private production PostgreSQL URL for the Compose postgres service}
      POSTGRES_USER: ${POSTGRES_USER:?Supply the production database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Supply the production database password}
      POSTGRES_DB: ${POSTGRES_DB:?Supply the production database name}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Supply the production Google OAuth client ID}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?Supply the production Google OAuth client ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?Supply the production Google OAuth client secret}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Supply the exact HTTPS marketplace and admin origins}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?Supply the HTTPS API origin}
      BACKEND_URL: ${BACKEND_URL:?Supply the HTTPS API origin}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?Supply the HTTPS browser API origin}
      AUTH_URL: ${AUTH_URL:?Supply the HTTPS marketplace origin}
    restart: "no"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  # Opt-in only. Starting applications NEVER applies migrations automatically.
  migrate:
    profiles: [migration]
    build: { context: .., target: migrate }
    environment:
      DATABASE_URL: ${DATABASE_URL:?Supply the private production PostgreSQL URL for the Compose postgres service}
    command: [migrate, deploy]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256

  backend:
    build: { context: .., target: backend }
    environment: *api-environment
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - production_public_assets:/app/runtime/public
      - production_private_documents:/app/runtime/private
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  # Not exposed publicly. Production supplies independent mTLS material and a
  # restricted admission DB URL; it never receives verifier signing keys.
  admission:
    build: { context: .., target: admission }
    environment:
      ADMISSION_DATABASE_URL: ${ADMISSION_DATABASE_URL:?Supply the restricted admission-runtime PostgreSQL URL}
      ADMISSION_TLS_KEY_FILE: /run/secrets/admission_tls_key
      ADMISSION_TLS_CERT_FILE: /run/secrets/admission_tls_cert
      ADMISSION_TLS_CLIENT_CA_FILE: /run/secrets/admission_client_ca
    secrets: [admission_tls_key, admission_tls_cert, admission_client_ca]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # Claims only canonical-publication outbox work through the restricted
  # dispatcher role; it has no admission or backend runtime credential.
  verifier:
    profiles: [verifier]
    build: { context: .., target: verifier }
    environment:
      VERIFIER_DISPATCH_DATABASE_URL: ${VERIFIER_DISPATCH_DATABASE_URL:?Supply the restricted dispatcher PostgreSQL URL}
      VERIFIER_WORKER_ID: ${VERIFIER_WORKER_ID:?Supply a stable verifier worker identity}
      ADMISSION_ENDPOINT: ${ADMISSION_ENDPOINT:?Supply the internal admission HTTPS endpoint}
      VERIFIER_TLS_KEY_FILE: /run/secrets/verifier_tls_key
      VERIFIER_TLS_CERT_FILE: /run/secrets/verifier_tls_cert
      VERIFIER_TLS_CA_FILE: /run/secrets/verifier_tls_ca
      VERIFIER_SIGNING_KEY_FILE: /run/secrets/verifier_signing_key
      VERIFIER_CANDIDATE_INBOX_ROOT: /artifacts/private/backup-candidates
      VERIFIER_STAGING_ROOT: /tmp/staging
      VERIFIER_CANONICAL_ROOT: /tmp/canonical
      VERIFIER_PRINCIPAL_ID: ${VERIFIER_PRINCIPAL_ID:?Supply the registered verifier principal}
      VERIFIER_CERTIFICATE_FINGERPRINT: ${VERIFIER_CERTIFICATE_FINGERPRINT:?Supply the registered verifier certificate fingerprint}
    volumes:
      - production_public_assets:/artifacts/public:ro
      - production_private_documents:/artifacts/private:ro
    secrets: [verifier_tls_key, verifier_tls_cert, verifier_tls_ca, verifier_signing_key]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  finalizer:
    profiles: [finalizer]
    build: { context: .., target: finalizer }
    environment:
      FINALIZER_DATABASE_URL: ${FINALIZER_DATABASE_URL:?Supply the restricted finalizer PostgreSQL URL}
      FINALIZER_WORKER_ID: ${FINALIZER_WORKER_ID:?Supply a stable finalizer worker identity}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  frontend:
    build:
      context: ..
      target: frontend
      args:
        BACKEND_URL: ${BACKEND_URL:?Supply the HTTPS API origin for frontend builds}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?Supply the HTTPS browser API origin for frontend builds}
    environment:
      BACKEND_URL: ${BACKEND_URL:?Supply the HTTPS API origin}
      AUTH_SECRET: ${AUTH_SECRET:?Supply the separate production Auth.js secret}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?Supply the production Google OAuth client ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?Supply the production Google OAuth client secret}
      AUTH_URL: ${AUTH_URL:?Supply the HTTPS marketplace origin}
      AUTH_TRUST_HOST: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0

  admin:
    build:
      context: ..
      target: admin
      args:
        BACKEND_URL: ${BACKEND_URL:?Supply the HTTPS API origin for admin builds}
    environment:
      BACKEND_URL: ${BACKEND_URL:?Supply the HTTPS API origin}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5

volumes:
  production_postgres_18:
  production_public_assets:
  production_private_documents:

secrets:
  admission_tls_key:
    file: "${ADMISSION_TLS_KEY_FILE:?Supply an admission TLS key file}"
  admission_tls_cert:
    file: "${ADMISSION_TLS_CERT_FILE:?Supply an admission TLS certificate file}"
  admission_client_ca:
    file: "${ADMISSION_TLS_CLIENT_CA_FILE:?Supply a verifier client CA file}"
  verifier_tls_key:
    file: "${VERIFIER_TLS_KEY_FILE:?Supply a verifier TLS key file}"
  verifier_tls_cert:
    file: "${VERIFIER_TLS_CERT_FILE:?Supply a verifier TLS certificate file}"
  verifier_tls_ca:
    file: "${VERIFIER_TLS_CA_FILE:?Supply an admission CA file}"
  verifier_signing_key:
    file: "${VERIFIER_SIGNING_KEY_FILE:?Supply a verifier signing key file}"
