services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verifier_test_owner
      POSTGRES_PASSWORD: verifier_test_owner_only
      POSTGRES_DB: porisrom_verifier_security_test
    ports:
      - "127.0.0.1:${HARNESS_PORT:?Harness must supply a fresh loopback port}:5432"
    volumes:
      - harness:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier_test_owner -d porisrom_verifier_security_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

volumes:
  harness:
    name: ${HARNESS_VOLUME:?Harness must supply a generated fresh volume name}
